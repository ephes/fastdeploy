name: CI

# Same gates as `just lint`, `just typecheck` and `just test`, plus the frontend
# type check and build. Tests only: this workflow needs no secrets and never
# deploys. Deploys go through the Ansible playbooks (ops-control), not Actions.

# Every branch push runs, so a branch gets a result before a pull request
# exists (agents push branches without opening one).
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'supersedable' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUNBUFFERED: "1"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON: "3.13"

jobs:
  python:
    name: Lint, mypy and pytest (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # pytest-env only sets DATABASE_URL as a default (D: flag), so this points
      # the suite at the service container. Throwaway credentials of that
      # container only; not a secret.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deploy_test
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Sync locked dependencies
        run: uv sync
      - name: Lint (just lint)
        run: just lint
      - name: Type check (just typecheck)
        run: just typecheck
      - name: Tests (just test-python)
        run: just test-python -q

  frontend:
    name: Frontend vitest and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Tests (vitest)
        run: npm test
      - name: Type check and build (vue-tsc, vite)
        run: npm run build
